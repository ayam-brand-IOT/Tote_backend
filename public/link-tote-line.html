<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Tote to Line</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tote">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #f1f5f9;
        }

        .topbar {
            background: #1e293b;
            border-bottom: 2px solid #334155;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar h1 { font-size: 1.15rem; color: #f1f5f9; }
        .topbar a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: all .18s;
        }
        .topbar a:hover { color: #f1f5f9; border-color: #64748b; }

        .page { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }

        .card {
            background: #1e293b;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
            border: 1.5px solid #334155;
        }
        .card-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 14px;
        }

        .scan-zone {
            border: 2px dashed #334155;
            border-radius: 14px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .scan-zone:hover     { border-color: #6366f1; background: rgba(99,102,241,.04); }
        .scan-zone.scanning  { border-color: #0d9488; border-style: solid; background: rgba(13,148,136,.07); }
        .scan-zone.success   { border-color: #10b981; border-style: solid; background: rgba(16,185,129,.07); }
        .scan-zone.error     { border-color: #ef4444; border-style: solid; background: rgba(239,68,68,.07); }
        .scan-zone-icon  { font-size: 2.2rem; margin-bottom: 8px; }
        .scan-zone-text  { font-size: 0.95rem; color: #64748b; }
        .scan-zone-value { font-size: 1.4rem; font-weight: 700; color: #f1f5f9; margin-top: 6px; }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 12px;
            color: #475569;
            font-size: 0.82rem;
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #334155;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.95rem;
            transition: border-color .18s;
        }
        input[type="text"]::placeholder { color: #475569; }
        input[type="text"]:focus { outline: none; border-color: #6366f1; }

        .input-row { display: flex; gap: 8px; }
        .input-row input { flex: 1; }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s;
            white-space: nowrap;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
        .btn-ghost { background: #334155; color: #cbd5e1; }
        .btn-ghost:hover { background: #475569; }

        .btn-clear {
            background: #450a0a;
            color: #fca5a5;
            border: 1px solid #ef4444;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all .18s;
        }
        .btn-clear:hover { background: #ef4444; color: white; }

        .line-info {
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #052e16;
            border: 1.5px solid #10b981;
            font-size: 0.88rem;
            display: none;
        }
        .line-info.visible { display: block; }
        .line-info.no-product { background: #1c1917; border-color: #f59e0b; }
        .preview-row { display: flex; gap: 8px; margin-bottom: 4px; }
        .preview-row:last-child { margin-bottom: 0; }
        .preview-label { color: #64748b; min-width: 80px; font-weight: 600; }
        .preview-value { color: #e2e8f0; }
        .preview-warn  { color: #fbbf24; font-size: 0.82rem; margin-top: 4px; }

        .alert {
            display: none;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 0.88rem;
        }
        .alert.visible { display: block; }
        .alert-error { background: #450a0a; color: #fca5a5; border: 1.5px solid #ef4444; }

        #recent-links { margin-top: 6px; }
        .recent-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 6px;
            border-left: 3px solid #10b981;
            font-size: 0.88rem;
            animation: slideIn .22s ease;
        }
        .recent-item:last-child { margin-bottom: 0; }
        .ri-tote { font-weight: 700; color: #e2e8f0; }
        .ri-line { color: #34d399; font-size: 0.8rem; margin-top: 2px; }
        .ri-dest { color: #60a5fa; font-size: 0.8rem; margin-top: 2px; }
        .ri-time { color: #475569; font-size: 0.78rem; }
        .ri-none { color: #475569; font-size: 0.85rem; font-style: italic; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        #success-flash {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(16,185,129,.12);
            z-index: 500;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #success-flash.visible { display: flex; }
        .flash-inner {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            padding: 24px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(16,185,129,.4);
        }
        .flash-icon  { font-size: 3rem; }
        .flash-label { font-size: 1.2rem; font-weight: 700; margin-top: 6px; }
        .flash-tote  { font-size: 0.92rem; opacity: .9; margin-top: 2px; }

        .qr-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .qr-modal.visible { display: flex; }
        .qr-modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 22px;
            border-radius: 18px;
            max-width: 460px;
            width: 92%;
            position: relative;
        }
        .qr-modal-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 14px;
        }
        .qr-close {
            position: absolute;
            top: 12px; right: 14px;
            background: none; border: none;
            font-size: 1.8rem; cursor: pointer;
            color: #64748b; line-height: 1;
        }
        .qr-close:hover { color: #f1f5f9; }
        #qr-reader { border-radius: 10px; overflow: hidden; }
        .qr-hint { text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 8px; }

        .count-badge {
            background: #052e16;
            border: 1px solid #10b981;
            color: #34d399;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <h1>🔗 Link Tote to Line <span class="count-badge">✓ <span id="link-count">0</span></span></h1>
        <a href="/">← Home</a>
    </div>

    <div class="page">

        <div id="main-alert" class="alert alert-error"></div>

        <!-- Line scan -->
        <div class="card">
            <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
                <span>1 · Scan Line</span>
                <button class="btn-clear" id="clear-line-btn" style="display:none;" onclick="clearLine()">✕ Clear</button>
            </div>
            <div class="scan-zone" id="line-scan-zone" onclick="openQR('line')">
                <div class="scan-zone-icon">📋</div>
                <div class="scan-zone-text">Tap to scan Line QR</div>
            </div>

            <div class="or-divider">or enter manually</div>

            <div class="input-row">
                <input type="text" id="manual-line" placeholder="Line ID" autocomplete="off"
                       onkeydown="if(event.key==='Enter') setLineManual()" />
                <button class="btn btn-ghost" onclick="setLineManual()">→ Set</button>
            </div>

            <div class="line-info" id="line-info"></div>
        </div>

        <!-- Tote scan -->
        <div class="card">
            <div class="card-title">2 · Scan Tote</div>
            <div class="scan-zone" id="tote-scan-zone" onclick="openQR('tote')">
                <div class="scan-zone-icon">📦</div>
                <div class="scan-zone-text">Tap to scan Tote QR</div>
            </div>

            <div class="or-divider">or enter manually</div>

            <div class="input-row">
                <input type="text" id="manual-tote" placeholder="Tote ID" autocomplete="off"
                       onkeydown="if(event.key==='Enter') linkManual()" />
                <button class="btn btn-ghost" onclick="linkManual()">→ Link</button>
            </div>
        </div>

        <!-- Recent links -->
        <div class="card">
            <div class="card-title">Recent links</div>
            <div id="recent-list">
                <p class="ri-none">No totes linked yet.</p>
            </div>
        </div>

    </div>

    <!-- Success flash -->
    <div id="success-flash">
        <div class="flash-inner">
            <div class="flash-icon">✓</div>
            <div class="flash-label">Linked!</div>
            <div class="flash-tote" id="flash-tote-id"></div>
        </div>
    </div>

    <!-- QR Modal -->
    <div class="qr-modal" id="qr-modal">
        <div class="qr-modal-content">
            <button class="qr-close" onclick="closeQR()">×</button>
            <div class="qr-modal-title" id="qr-modal-title">Scan QR Code</div>
            <div id="qr-reader"></div>
            <p class="qr-hint">Position the QR code within the camera frame</p>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="/pwa.js"></script>
    <script>
        let currentLineId = null;
        let currentLineInfo = null;
        let linkCount = 0;
        let qrScanner = null;
        let qrTarget = null;

        // ── QR Scanner ────────────────────────────────────────────────────────
        function openQR(target) {
            qrTarget = target;
            document.getElementById('qr-modal-title').textContent =
                target === 'line' ? '📋 Scan Line QR' : '📦 Scan Tote QR';
            document.getElementById('qr-modal').classList.add('visible');

            qrScanner = new Html5Qrcode('qr-reader');
            qrScanner.start(
                { facingMode: 'environment' },
                { fps: 12, qrbox: { width: 260, height: 260 } },
                async (decoded) => {
                    await closeQR();
                    const val = decoded.trim();
                    if (qrTarget === 'line') await setLine(val);
                    else                     await linkTote(val);
                },
                () => {}
            ).catch(() => {
                closeQR();
                showAlert('Cannot access camera — use manual input.');
            });
        }

        async function closeQR() {
            document.getElementById('qr-modal').classList.remove('visible');
            if (qrScanner) {
                try { await qrScanner.stop(); } catch {}
                try { qrScanner.clear(); } catch {}
                qrScanner = null;
            }
        }

        // ── Line handling ─────────────────────────────────────────────────────
        async function setLine(lineId) {
            clearAlert();
            try {
                const res = await fetch(`/api/lines/${encodeURIComponent(lineId)}`);
                if (!res.ok) {
                    showAlert(`Line "${lineId}" not found.`);
                    updateLineScanZone(null);
                    return;
                }
                const data = await res.json();
                const line = data.line;

                currentLineId = line.line_id;
                currentLineInfo = line;
                updateLineScanZone(line);
                showLineInfo(line);
                document.getElementById('clear-line-btn').style.display = '';
                document.getElementById('manual-line').value = '';
                document.getElementById('manual-tote').focus();
            } catch {
                showAlert('Error fetching line details.');
                updateLineScanZone(null);
            }
        }

        function setLineManual() {
            const val = document.getElementById('manual-line').value.trim();
            if (val) setLine(val);
        }

        function clearLine() {
            currentLineId = null;
            currentLineInfo = null;
            document.getElementById('clear-line-btn').style.display = 'none';
            updateLineScanZone(null);
            hideLineInfo();
            clearAlert();
        }

        function updateLineScanZone(line) {
            const zone = document.getElementById('line-scan-zone');
            if (line) {
                zone.className = 'scan-zone success';
                zone.innerHTML = `
                    <div class="scan-zone-icon">📋</div>
                    <div class="scan-zone-text">Line set</div>
                    <div class="scan-zone-value">${line.line_id}</div>
                `;
            } else {
                zone.className = 'scan-zone';
                zone.innerHTML = `
                    <div class="scan-zone-icon">📋</div>
                    <div class="scan-zone-text">Tap to scan Line QR</div>
                `;
            }
        }

        function showLineInfo(line) {
            const el = document.getElementById('line-info');
            if (!line) { el.style.display = 'none'; return; }
            const ok = !!line.product;
            el.innerHTML = `
                <div class="preview-row">
                    <span class="preview-label">Product:</span>
                    <span class="preview-value">${ok ? line.product : '⚠ No active product assigned'}</span>
                </div>
                ${ok ? `
                <div class="preview-row">
                    <span class="preview-label">Type:</span>
                    <span class="preview-value">${line.type || '—'}</span>
                </div>
                <div class="preview-row">
                    <span class="preview-label">Size:</span>
                    <span class="preview-value">${line.size || '—'}</span>
                </div>
                ${line.destination ? `
                <div class="preview-row">
                    <span class="preview-label">Destination:</span>
                    <span class="preview-value">${line.destination.replace('_', ' ')}</span>
                </div>` : ''}
                ` : `<div class="preview-warn">Assign a product to this line before linking totes.</div>`}
            `;
            el.className = ok ? 'line-info visible' : 'line-info visible no-product';
        }

        function hideLineInfo() {
            const el = document.getElementById('line-info');
            el.style.display = 'none';
            el.innerHTML = '';
        }

        // ── Tote linking ──────────────────────────────────────────────────────
        function linkManual() {
            const val = document.getElementById('manual-tote').value.trim();
            if (val) linkTote(val);
        }

        async function linkTote(toteId) {
            if (!currentLineId) {
                showAlert('Scan or enter a Line ID first.');
                return;
            }
            if (!currentLineInfo?.product) {
                showAlert('This line has no active product. Assign a product from the management panel first.');
                return;
            }
            clearAlert();
            setToteScanZone('scanning', '⏳', 'Linking…', toteId);

            try {
                const res = await fetch('/api/tote-line/link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tote_id: toteId, line_id: currentLineId })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Link failed');

                setToteScanZone('success', '✓', 'Linked!', toteId);
                flashSuccess(toteId);
                addRecentLink(toteId, currentLineId, data.link?.destination);
                linkCount++;
                document.getElementById('link-count').textContent = linkCount;

                document.getElementById('manual-tote').value = '';
                setTimeout(() => {
                    setToteScanZone('idle', '📦', 'Tap to scan Tote QR', '');
                    document.getElementById('manual-tote').focus();
                }, 1400);

            } catch (err) {
                setToteScanZone('error', '✗', err.message, toteId);
                showAlert(err.message);
                setTimeout(() => setToteScanZone('idle', '📦', 'Tap to scan Tote QR', ''), 2500);
            }
        }

        // ── UI helpers ────────────────────────────────────────────────────────
        function setToteScanZone(state, icon, text, value) {
            const zone = document.getElementById('tote-scan-zone');
            zone.className = 'scan-zone' + (state !== 'idle' ? ' ' + state : '');
            zone.innerHTML = `
                <div class="scan-zone-icon">${icon}</div>
                <div class="scan-zone-text">${text}</div>
                ${value ? `<div class="scan-zone-value">${value}</div>` : ''}
            `;
        }

        function flashSuccess(toteId) {
            document.getElementById('flash-tote-id').textContent = toteId;
            const el = document.getElementById('success-flash');
            el.classList.add('visible');
            setTimeout(() => el.classList.remove('visible'), 900);
        }

        function addRecentLink(toteId, lineId, destination) {
            const list = document.getElementById('recent-list');
            const placeholder = list.querySelector('p');
            if (placeholder) placeholder.remove();

            const time = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            const item = document.createElement('div');
            item.className = 'recent-item';
            item.innerHTML = `
                <div>
                    <div class="ri-tote">📦 ${toteId}</div>
                    <div class="ri-line">📋 ${lineId}</div>
                    ${destination ? `<div class="ri-dest">→ ${destination.replace('_',' ')}</div>` : ''}
                </div>
                <div class="ri-time">${time}</div>
            `;
            list.insertBefore(item, list.firstChild);
            const items = list.querySelectorAll('.recent-item');
            if (items.length > 8) items[items.length - 1].remove();
        }

        function showAlert(msg) {
            const el = document.getElementById('main-alert');
            el.textContent = msg;
            el.classList.add('visible');
        }
        function clearAlert() {
            const el = document.getElementById('main-alert');
            el.textContent = '';
            el.classList.remove('visible');
        }
    </script>
</body>
</html>
