version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: tote_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-tote_db}
      MYSQL_USER: ${DB_USER:-tote_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-totepassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tote_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Application
  backend:
    build: .
    container_name: tote_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-tote_user}
      DB_PASSWORD: ${DB_PASSWORD:-totepassword}
      DB_NAME: ${DB_NAME:-tote_db}
      PORT: ${PORT:-3000}
    ports:
      - "3000:3000"  # HTTP REST API (para ESP32)
      - "3001:3001"  # WebSocket (para ESP32)
    networks:
      - tote_network
    command: sh -c "sleep 10 && node init-db.js && node index.js"

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: tote_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - tote_network

volumes:
  db_data:
    driver: local

networks:
  tote_network:
    driver: bridge
